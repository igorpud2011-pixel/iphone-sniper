
name: iPhone Sniper OLX

on:
  push:
    branches: [main]
    paths:
      - bot.py
      - tests/**
      - discord-control.mjs
      - discord-control.test.mjs
      - .github/workflows/monitor.yml
  repository_dispatch:
    types: [monitor-restart]
  workflow_dispatch:
    inputs:
      session_minutes:
        description: Czas sesji (1–300 min); potem automatyczny restart
        type: number
        default: 300
      test_discord:
        description: 'Wyślij tylko test Discorda (bez skanowania OLX)'
        type: boolean
        default: false
  schedule:
    - cron: '2-57/5 * * * *'

permissions:
  contents: write

concurrency:
  group: iphone-sniper-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v7

      - name: Ustaw Pythona
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Zainstaluj biblioteki
        run: python -m pip install -r requirements.txt

      - name: Testy programu
        run: python -m unittest discover -s tests -v

      - name: Testy sterowania Discord
        run: node --test discord-control.test.mjs

      - name: Sprawdź nowe ogłoszenia
        id: scan
        continue-on-error: true
        env:
          RESALE_PRICES_JSON: ${{ secrets.RESALE_PRICES_JSON }}
          SETTINGS_URL: ${{ secrets.SETTINGS_URL }}
          SETTINGS_KEY: ${{ secrets.SETTINGS_KEY }}
          SESSION_MINUTES: ${{ inputs.session_minutes || 300 }}
          TEST_DISCORD: ${{ inputs.test_discord }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_DAMAGED_WEBHOOK_URL: ${{ secrets.DISCORD_DAMAGED_WEBHOOK_URL }}
          DISCORD_DEALS_WEBHOOK_URL: ${{ secrets.DISCORD_DEALS_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$TEST_DISCORD" = "true" ]; then
            python bot.py --test-discord
          else
            # One runner performs repeated checks; delayed cron starts no longer
            # determine the interval between scans during an active session.
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            minutes="$SESSION_MINUTES"
            if ! [[ "$minutes" =~ ^[0-9]+$ ]] || [ "$minutes" -lt 1 ] || [ "$minutes" -gt 300 ]; then minutes=300; fi
            deadline=$((SECONDS + minutes * 60))
            last_code=0
            while [ "$SECONDS" -lt "$deadline" ]; do
              started=$SECONDS
              if python bot.py; then
                last_code=0
              else
                last_code=$?
                echo "::warning::Niepełny skan; ponowię za minutę"
              fi
              # Detect source changes before a state push can pull them locally.
              git fetch origin main --quiet
              source_changed=false
              if ! git diff --quiet HEAD origin/main -- . ':!data/seen.json'; then
                source_changed=true
              fi
              git add data/seen.json
              if ! git diff --cached --quiet; then
                git commit -m "Aktualizacja zapisanych ofert"
                git pull --rebase origin main
                git push
              fi
              # Restart through the tested checkout instead of running newly pulled code.
              if [ "$source_changed" = "true" ]; then break; fi
              delay=$((60 - (SECONDS - started)))
              if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            done
            exit "$last_code"
          fi

      - name: Zapisz wykryte ogłoszenia
        if: ${{ always() && steps.scan.outcome != 'skipped' && inputs.test_discord != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizacja zapisanych ofert"
            git pull --rebase origin main
            git push
          fi

      - name: Wynik sprawdzenia
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          if [ "$SCAN_OUTCOME" != "success" ]; then
            echo '### Monitor nie potwierdził poprawnego działania' >> "$GITHUB_STEP_SUMMARY"
            echo 'Sprawdź log kroku Sprawdź nowe ogłoszenia. HTTP 403 oznacza odmowę dostępu OLX. Sam zielony test parsera nie potwierdza dostępu do OLX ani wysłania alertów.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '### Sprawdzenie zakończone poprawnie' >> "$GITHUB_STEP_SUMMARY"

      - name: Uruchom następną sesję bez oczekiwania na cron
        if: ${{ always() && !cancelled() && steps.scan.outcome != 'skipped' && inputs.test_discord != true }}
        env:
          SESSION_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import json,os,time,urllib.request,urllib.error
          url=os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']+'/dispatches'
          body=json.dumps({'event_type':'monitor-restart'}).encode()
          for attempt in range(3):
              request=urllib.request.Request(url,data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['SESSION_GITHUB_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(request,timeout=15) as response:
                      assert response.status==204
                  print('GitHub przyjął uruchomienie kolejnej sesji.');break
              except (urllib.error.URLError,TimeoutError):
                  if attempt==2:raise RuntimeError('Restart nie został potwierdzony; pozostaje harmonogram awaryjny.') from None
                  time.sleep(3)
          PYCODE
