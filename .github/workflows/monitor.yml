
name: iPhone Sniper OLX

on:
  push:
    branches: [main]
    paths:
      - bot.py
      - tests/**
      - .github/workflows/monitor.yml
  workflow_dispatch:
    inputs:
      test_discord:
        description: 'Wyślij tylko test Discorda (bez skanowania OLX)'
        type: boolean
        default: false
  schedule:
    - cron: '2-57/5 * * * *'

permissions:
  contents: write

concurrency:
  group: iphone-sniper-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zainstaluj biblioteki
        run: python -m pip install -r requirements.txt

      - name: Testy programu
        run: python -m unittest discover -s tests -v

      - name: Test dostarczenia Discorda
        if: github.event_name == 'push'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot.py --test-discord

      - name: Sprawdź nowe ogłoszenia
        id: scan
        continue-on-error: true
        env:
          TEST_DISCORD: ${{ inputs.test_discord }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$TEST_DISCORD" = "true" ]; then
            python bot.py --test-discord
          else
            python bot.py
          fi

      - name: Zapisz wykryte ogłoszenia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizacja zapisanych ofert"
            git push
          fi

      - name: Wynik sprawdzenia
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          if [ "$SCAN_OUTCOME" != "success" ]; then
            echo '### Monitor nie potwierdził poprawnego działania' >> "$GITHUB_STEP_SUMMARY"
            echo 'Sprawdź log kroku Sprawdź nowe ogłoszenia. HTTP 403 oznacza odmowę dostępu OLX. Sam zielony test parsera nie potwierdza dostępu do OLX ani wysłania alertów.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '### Sprawdzenie zakończone poprawnie' >> "$GITHUB_STEP_SUMMARY"
