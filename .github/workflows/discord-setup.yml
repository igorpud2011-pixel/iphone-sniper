name: Konfiguracja komend Discord
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
      - name: Ustaw Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Zarejestruj komendy na wskazanym serwerze
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node discord-register.mjs
