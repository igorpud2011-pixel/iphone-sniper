name: Alerty Vinted
on:
  schedule:
    - cron: '2,22,42 * * * *'
  push:
    branches: [main]
    paths: [vinted_monitor.py, .github/workflows/vinted.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vinted-alerts
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v4
        id: state
        with:
          path: .vinted-state.json
          key: vinted-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vinted-state-
      - run: python3 -m pip install -r requirements.txt
      - name: Skanuj katalog Vinted
        run: |
          scans=4
          result=0
          for ((scan=1; scan<=scans; scan++)); do
            started=$SECONDS
            echo "::group::Skan $scan/$scans"
            timeout 180s python3 -u vinted_monitor.py && result=0 || result=$?
            echo "::endgroup::"
            delay=$((300 - (SECONDS - started)))
            if [ "$scan" -lt "$scans" ] && [ "$delay" -gt 0 ]; then sleep "$delay"; fi
          done
          exit "$result"
        env:
          DISCORD_VINTED_WEBHOOK_URL: ${{ secrets.DISCORD_VINTED_WEBHOOK_URL }}
          SETTINGS_URL: ${{ secrets.SETTINGS_URL }}
          SETTINGS_KEY: ${{ secrets.SETTINGS_KEY }}
          RESALE_PRICES_JSON: ${{ secrets.RESALE_PRICES_JSON }}
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && hashFiles('.vinted-state.json') != '' }}
        with:
          path: .vinted-state.json
          key: ${{ steps.state.outputs.cache-primary-key }}
